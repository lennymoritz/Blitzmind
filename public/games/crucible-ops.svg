      <stop offset="0%" stop-color="#ff3344" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#ff3344" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ff3344" stop-opacity="0"/>
